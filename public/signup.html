<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우산 대여 회원가입</title>
<style>
:root{--bg:#E6ECF0;--card:#F7FAFB;--ink:#12202B;--muted:#5B6B77;--line:#C5D0D8;--accent:#F2B705;--err:#B3261E;--ok:#1B6B3A;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A22;--card:#17252F;--ink:#E8F0F5;--muted:#93A5B2;--line:#2A3C48;--err:#F2B8B5;--ok:#8FD6A8;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
main{max-width:440px;margin:0 auto;padding:28px 20px 40px}
h1{font-size:30px;font-weight:900;margin:0 0 6px}
p{margin:0 0 16px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input{width:100%;font:inherit;font-size:16px;padding:13px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{width:100%;margin-top:18px;font:inherit;font-weight:900;font-size:17px;padding:15px;border:0;border-radius:12px;background:var(--accent);color:#12202B;cursor:pointer}
button:disabled{opacity:.5}
#msg{min-height:22px;margin:12px 0 0;font-size:14px;font-weight:700}
#msg.err{color:var(--err)}#msg.ok{color:var(--ok)}
</style>
</head>
<body>
<main>
  <h1>회원가입</h1>
  <p>학번과 이름으로 가입하면 우산을 빌릴 수 있어요.</p>
  <div class="card">
    <label for="sid">학번</label>
    <input id="sid" inputmode="numeric" autocomplete="username" placeholder="예: 20240001">
    <label for="nm">이름</label>
    <input id="nm" autocomplete="name">
    <label for="pw">비밀번호 (6자 이상)</label>
    <input id="pw" type="password" autocomplete="new-password">
    <label for="pw2">비밀번호 확인</label>
    <input id="pw2" type="password" autocomplete="new-password">
    <p id="msg" role="alert"></p>
    <button id="btn">가입하기</button>
  </div>
</main>
<script>
var $=function(i){return document.getElementById(i)};
function say(t,c){$("msg").textContent=t;$("msg").className=c||""}
$("btn").onclick=async function(){
  if($("pw").value!==$("pw2").value){say("비밀번호가 서로 달라요.","err");return}
  $("btn").disabled=true;say("가입 중이에요…");
  try{
    var r=await fetch("/api/signup",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({studentId:$("sid").value.trim(),name:$("nm").value,password:$("pw").value})});
    var d=await r.json();
    if(r.ok)say("가입이 완료됐어요. 이제 로그인할 수 있어요.","ok");else say(d.error||"가입하지 못했어요.","err");
  }catch(e){say("서버에 연결하지 못했어요.","err")}
  $("btn").disabled=false;
};
</script>
</body>
</html>
