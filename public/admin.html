<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리 · Umbrella DB</title>
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <h1>우산 / 사용자 DB 관리</h1>
  <p class="muted">device 비밀번호 입력 후 로그인 · 주기 새로고침은 firebase-config의 <code>cost.uiRefreshMs</code></p>
  <p id="status" class="muted">연결 중…</p>

  <div class="card">
    <h2>우산 보관 상태</h2>
    <div id="umbBox">불러오는 중…</div>
  </div>

  <div class="card">
    <h2>사용자</h2>
    <div id="userBox">불러오는 중…</div>
  </div>

  <div class="card" id="historyCard" hidden>
    <h2 id="historyTitle">대여 기록</h2>
    <div id="historyBox">기록을 불러오는 중…</div>
  </div>

  <div class="card">
    <h2>활성 대여</h2>
    <div id="rentBox">불러오는 중…</div>
  </div>

  <p><a href="/">← 앱으로</a> · <a href="/device.html">장치 테스트</a></p>

<script src="/firebase-config.js?v=3"></script>
<script type="module">
import {
  getMode, loginDevice, listAllUmbrellas, listStudents, listActiveRentals, listStudentRentals,
  setUmbrellaStatus, deleteStudent, seedInventory, friendlyError, stationQr, stationLabel,
} from "/js/backend.js?v=120";

const $ = (id) => document.getElementById(id);
const fmt = (ts) => (ts ? new Date(ts).toLocaleString("ko-KR") : "-");
const esc = (v) => String(v ?? "-").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const place = (code) => esc(stationLabel(code));
const placeSlot = (code, slot) => esc(`${stationQr(code)}-${slot}`);
let historyUser = null;

function table(headers, rows, emptyText) {
  const head = headers.map((h) => `<th>${h}</th>`).join("");
  const body = rows.length
    ? rows.map((cells) => `<tr>${cells.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")
    : `<tr><td colspan="${headers.length}">${emptyText}</td></tr>`;
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

function userKey(u) {
  return String((u && (u.uid || u.studentId)) || "");
}

function rentalPlace(station, slot) {
  if (!station && !slot) return "-";
  if (station && slot) return placeSlot(station, slot);
  return place(station);
}

async function renderHistory(user) {
  const card = $("historyCard");
  card.hidden = false;
  $("historyTitle").textContent = `${user.name || "사용자"} (${user.studentId || "-"}) 대여 기록`;
  try {
    const rows = await listStudentRentals({ uid: user.uid || "", studentId: user.studentId || "" });
    if (userKey(historyUser) !== userKey(user)) return;
    $("historyBox").innerHTML = table(
      ["상태", "대여 위치", "대여 시각", "기한", "반납 시각", "반납 위치"],
      rows.map((r) => {
        const done = !!(r.returned_at || r.status === "returned");
        return [
          done ? "반납완료" : "대여중",
          rentalPlace(r.station, r.slot),
          fmt(r.rented_at),
          fmt(r.due_at),
          done ? fmt(r.returned_at) : "-",
          done ? rentalPlace(r.return_station, r.return_slot) : "-",
        ];
      }),
      "대여 기록 없음"
    );
  } catch (e) {
    if (userKey(historyUser) !== userKey(user)) return;
    $("historyBox").textContent = friendlyError(e);
  }
}

async function loadAll() {
  const [umbs, users, rents] = await Promise.all([
    listAllUmbrellas(),
    listStudents().catch(() => []),
    listActiveRentals().catch(() => []),
  ]);

  $("umbBox").innerHTML = table(
    ["ID", "대여소", "슬롯", "상태", "대여자", "변경"],
    umbs.map((u) => {
      const st = u.status === "out" ? "out" : "in";
      return [
        esc(u.id), place(u.station), esc(u.slot),
        `<span class="pill ${st}">${st === "in" ? "보관중" : "대여중"}</span>`,
        esc(u.rented_by),
        `<button data-id="${u.station}|${u.slot}|in">보관</button>
         <button data-id="${u.station}|${u.slot}|out">대여중</button>`,
      ];
    }),
    "우산 데이터 없음"
  );
  $("umbBox").querySelectorAll("button[data-id]").forEach((btn) => {
    btn.onclick = async () => {
      const [station, slot, status] = btn.dataset.id.split("|");
      try {
        await setUmbrellaStatus({ station, slot: Number(slot), status });
        await loadAll();
      } catch (e) {
        alert(friendlyError(e));
      }
    };
  });

  $("userBox").innerHTML = table(
    ["학번", "이름", "재학생 인증", "결제수단", "가입", "활성 대여", "관리"],
    users.map((u) => [
      esc(u.studentId), esc(u.name), u.lmsVerified ? "인증됨" : "미인증",
      (u.paymentRegistered || u.paymentMethod) ? "등록됨" : "미등록",
      fmt(u.created_at),
      u.activeRental
        ? `${placeSlot(u.activeRental.station, u.activeRental.slot)} · ${fmt(u.activeRental.rented_at)}`
        : "-",
      `<span class="row-actions"><button class="ghost" type="button" data-act="history" data-uid="${esc(u.uid || "")}" data-sid="${esc(u.studentId || "")}" data-name="${esc(u.name || "")}">기록</button><button class="danger" type="button" data-act="delete" data-uid="${esc(u.uid || "")}" data-sid="${esc(u.studentId || "")}" data-name="${esc(u.name || "")}">삭제</button></span>`,
    ]),
    "사용자 없음 (앱에서 회원가입)"
  );
  $("userBox").querySelectorAll("button[data-act]").forEach((btn) => {
    btn.onclick = async () => {
      const name = btn.dataset.name || "이 사용자";
      const sid = btn.dataset.sid || "";
      const user = { uid: btn.dataset.uid || "", studentId: sid, name };
      if (btn.dataset.act === "history") {
        historyUser = user;
        $("historyBox").textContent = "기록을 불러오는 중…";
        await renderHistory(user);
        $("historyCard").scrollIntoView({ block: "nearest" });
        return;
      }
      const ok = confirm(`${name} (${sid}) 계정을 삭제할까요?\n로그인 계정과 대여 기록도 함께 지워집니다.`);
      if (!ok) return;
      btn.disabled = true;
      try {
        await deleteStudent({ uid: user.uid, studentId: sid });
        if (historyUser && userKey(historyUser) === userKey(user)) {
          historyUser = null;
          $("historyCard").hidden = true;
        }
        await loadAll();
      } catch (e) {
        alert(friendlyError(e));
        btn.disabled = false;
      }
    };
  });

  if (historyUser) {
    const still = users.find((u) => userKey(u) === userKey(historyUser));
    if (still) renderHistory(still);
    else {
      historyUser = null;
      $("historyCard").hidden = true;
    }
  }

  $("rentBox").innerHTML = table(
    ["학번", "위치", "대여시각", "기한"],
    rents.map((r) => [esc(r.studentId), placeSlot(r.station, r.slot), fmt(r.rented_at), fmt(r.due_at)]),
    "활성 대여 없음"
  );
}

(async () => {
  try {
    $("status").textContent = `mode=${getMode()} · 로그인 중…`;
    await loginDevice();
    await seedInventory();
    $("status").className = "ok";
    $("status").textContent = `연결됨 · ${getMode()}`;
    await loadAll();
    const ms = (window.UMBRELLA?.cost?.uiRefreshMs) || 10000;
    setInterval(() => loadAll().catch(() => {}), ms);
  } catch (e) {
    $("status").className = "err";
    $("status").textContent = `실패: ${friendlyError(e)} — device 계정/설정 확인`;
  }
})();
</script>
</body>
</html>
