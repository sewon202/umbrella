<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우산 대여</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
:root{--bg:#E6ECF0;--card:#F7FAFB;--ink:#12202B;--muted:#5B6B77;--line:#C5D0D8;--accent:#F2B705;--door:#2F4A5C;--err:#B3261E;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A22;--card:#17252F;--ink:#E8F0F5;--muted:#93A5B2;--line:#2A3C48;--door:#3C5E74;--err:#F2B8B5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A22;--card:#17252F;--ink:#E8F0F5;--muted:#93A5B2;--line:#2A3C48;--door:#3C5E74;--err:#F2B8B5;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5;min-height:100vh}
main{max-width:440px;margin:0 auto;padding:28px 20px 40px}
h1{font-size:30px;font-weight:900;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:20px;font-weight:900;margin:0 0 4px}
p{margin:0 0 16px;color:var(--muted)}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
input{width:100%;font:inherit;font-size:15px;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{width:100%;margin-top:14px;font:inherit;font-weight:900;font-size:16px;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#12202B;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);margin-top:10px;font-weight:700}
.err{color:var(--err);font-size:13px;min-height:18px;margin:6px 0 0}
.hint{font-size:13px;color:var(--muted);margin-top:14px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:14px;color:var(--muted)}
.top button{font:inherit;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer;padding:4px}
.place{font-size:26px;font-weight:900;margin:4px 0 2px}
.cab{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;perspective:700px;margin:16px 0 4px;padding:12px;background:var(--line);border-radius:14px}
.door{position:relative;aspect-ratio:3/4;border:0;border-radius:8px;background:var(--door);color:#fff;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transform-origin:left center;transition:transform .7s cubic-bezier(.3,.7,.2,1),box-shadow .2s}
.door .n{font-size:34px;font-weight:900;line-height:1}
.door .t{font-size:12px;opacity:.85}
.door.sel{box-shadow:0 0 0 4px var(--accent)}
.door:disabled{background:transparent;color:var(--muted);border:1.5px dashed var(--muted);cursor:not-allowed}
.door.open{transform:rotateY(-72deg)}
.msg{min-height:48px;margin:12px 0 0;color:var(--ink);font-weight:700}
.timer{margin-bottom:16px;background:var(--door);color:#fff;border:0}
.timer[hidden]{display:none}
.timer.over{background:#B3261E}
.tl{font-size:14px;opacity:.9}
.tv{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.2}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.25);margin:10px 0}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.ts{font-size:13px;opacity:.9}
.divider{margin:20px 0 14px;border:0;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){.door{transition:none}}
</style>
</head>
<body>
<main>

<section class="view on" id="v-login">
  <h1>우산 대여</h1>
  <p>학생증 정보로 로그인하면 바로 빌릴 수 있어요.</p>
  <div class="card">
    <h2>로그인</h2>
    <label for="sid">학번</label>
    <input id="sid" inputmode="numeric" autocomplete="username" placeholder="예: 20240001">
    <label for="pw">비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password">
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn" id="loginBtn">로그인</button>

    <hr class="divider">

    <h2>간편 회원가입</h2>
    <label for="joinSid">학번</label>
    <input id="joinSid" inputmode="numeric" placeholder="학번 6~10자리">
    <label for="joinName">이름</label>
    <input id="joinName" placeholder="이름 입력">
    <label for="joinPw">비밀번호</label>
    <input id="joinPw" type="password" placeholder="6자 이상 비밀번호">
    <p class="err" id="joinErr" role="alert"></p>
    <button class="btn ghost" id="joinBtn">회원가입하기</button>
  </div>
</section>

<!-- 장소 확인 화면 (QR 연동) -->
<section class="view" id="v-place">
  <div class="top"><span id="who1"></span><button class="logout">로그아웃</button></div>
  <div class="timer card" hidden><div class="tl"></div><div class="tv"></div><div class="bar"><i></i></div><div class="ts"></div></div>
  <p>QR로 연결된 장소를 확인해 주세요.</p>
  <div class="card">
    <div class="place" id="placeName"></div>
    <p id="placeCode"></p>
    <button class="btn" id="placeYes">맞아요, 여기예요</button>
    <button class="btn ghost" id="placeNo">장소가 달라요</button>
    <p class="err" id="placeErr"></p>
  </div>
</section>

<!-- 우산 선택 및 대여 화면 (모두 대여 가능하게 세팅) -->
<section class="view" id="v-pick">
  <div class="top"><span id="who2"></span><button class="logout">로그아웃</button></div>
  <div class="timer card" hidden><div class="tl"></div><div class="tv"></div><div class="bar"><i></i></div><div class="ts"></div></div>
  <h2 id="pickTitle"></h2>
  <p id="pickDesc"></p>
  <div class="cab" id="cab"></div>
  <p class="msg" id="msg" aria-live="polite"></p>
  <button class="btn" id="go" disabled></button>
  <button class="btn ghost" id="tagBtn" hidden>시연: 우산 손잡이 태그하기</button>
</section>

</main>
<script>
// 대여소 장소 정의
var STATIONS={
  A1:"학생회관 1층 정문",
  B2:"중앙도서관 출입구",
  C3:"공학관 로비"
};
var KEY="umb-demo2",LIMIT=48*3600*1000;

function load(){
  try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.slots)return s}catch(e){}
  // 2. 우산 대여가 모두 가능하도록(모든 칸에 우산이 'in' 상태로 있도록) 초기값 설정
  return{
    slots:{1:"in", 2:"in", 3:"in", 4:"in", 5:"in", 6:"in"},
    rent:{}
  }
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
var st=load(),user=null,sel=null,openSlot=null,busy=false,waitTag=null;

// 1. QR 코드 연동: 웹페이지 주소 뒤에 해시(#A1, #B2, #C3 등)를 붙여 장소를 바꿉니다.
// 예: http://localhost:3000/#B2 로 접속하면 중앙도서관 출입구로 인식됩니다!
var sk=(location.hash||"#A1").slice(1).toUpperCase();
if(!STATIONS[sk])sk="A1";

function $(id){return document.getElementById(id)}
function show(id){document.querySelectorAll(".view").forEach(function(v){v.classList.remove("on")});$(id).classList.add("on");window.scrollTo(0,0)}

function openDoor(station,slot){return new Promise(function(r){setTimeout(r,700)})}

// 로그인 API 연동
function login(){
  var studentId = $("sid").value.trim();
  var password = $("pw").value;
  
  fetch("/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ studentId, password })
  })
  .then(res => res.json().then(data => ({ status: res.status, body: data })))
  .then(res => {
    if (res.status !== 200) {
      $("loginErr").textContent = res.body.error || "학번 또는 비밀번호가 맞지 않아요.";
      return;
    }
    user = { id: studentId, name: res.body.name };
    $("loginErr").textContent = "";
    $("pw").value = "";
    $("who1").textContent = $("who2").textContent = user.name + "님";
    
    // 장소 정보 반영
    $("placeName").textContent = STATIONS[sk];
    $("placeCode").textContent = "대여소 코드 " + sk;
    $("placeErr").textContent = "";
    
    tick();
    show("v-place"); // 로그인 성공 시 장소 확인 화면으로 이동
  })
  .catch(() => {
    $("loginErr").textContent = "서버 통신 중 오류가 발생했어요.";
  });
}

// 회원가입 API 연동
function signupInline(){
  var studentId = $("joinSid").value.trim();
  var name = $("joinName").value.trim();
  var password = $("joinPw").value;

  fetch("/api/signup", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ studentId, name, password })
  })
  .then(res => res.json().then(data => ({ status: res.status, body: data })))
  .then(res => {
    if (res.status !== 201) {
      $("joinErr").style.color = "var(--err)";
      $("joinErr").textContent = res.body.error || "회원가입에 실패했어요.";
      return;
    }
    $("joinErr").style.color = "#2E7D32";
    $("joinErr").textContent = "회원가입 성공! 위 로그인 창에서 로그인해 주세요.";
    $("joinSid").value = "";
    $("joinName").value = "";
    $("joinPw").value = "";
  })
  .catch(() => {
    $("joinErr").style.color = "var(--err)";
    $("joinErr").textContent = "서버 통신 중 오류가 발생했어요.";
  });
}

function logout(){user=null;sel=null;openSlot=null;waitTag=null;$("tagBtn").hidden=true;show("v-login")}

function render(){
  var r0=st.rent[user.id],mine=r0&&r0.slot,cab=$("cab");cab.innerHTML="";
  $("pickTitle").textContent=mine?"우산 반납":"우산 번호 선택";
  $("pickDesc").textContent=mine?"내가 빌린 "+mine+"번 칸에 우산을 넣어 주세요.":"우산이 있는 칸을 골라 주세요.";
  
  for(var i=1;i<=6;i++){(function(i){
    var free=mine?i===mine:st.slots[i]==="in";
    var b=document.createElement("button");
    b.className="door"+(sel===i?" sel":"")+(openSlot===i?" open":"");
    b.disabled=!free||busy||!!waitTag;
    b.setAttribute("aria-label",i+"번 "+(mine?(i===mine?"내 칸":"사용 불가"):(free?"우산 있음":"대여 중")));
    b.innerHTML='<span class="n">'+i+'</span><span class="t">'+(mine?(i===mine?"내 칸":"사용 불가"):(free?"우산 있음":"대여 중"))+'</span>';
    b.onclick=function(){sel=i;$("msg").textContent="";render()};
    cab.appendChild(b);
  })(i)}
  
  var g=$("go");g.disabled=!sel||busy||!!waitTag;
  g.textContent=sel?(mine?sel+"번 문 열고 반납하기":sel+"번 우산 꺼내기"):"번호를 선택해 주세요";
}

function go(){
  if(!sel||busy)return;busy=true;$("msg").textContent="문을 여는 중이에요…";render();
  var slot=sel,r0=st.rent[user.id],mine=r0&&r0.slot;
  openDoor(sk,slot).then(function(){
    if(mine){waitTag=slot;openSlot=slot;busy=false;sel=null;$("tagBtn").hidden=false;$("msg").textContent=slot+"번 문이 열렸어요. 우산을 넣어 주세요. 손잡이 태그가 인식되면 자동으로 반납돼요.";render();return}
    st.slots[slot]="out";st.rent[user.id]={slot:slot,at:Date.now()};
    save();openSlot=slot;busy=false;sel=null;tick();
    $("msg").textContent=slot+"번 문이 열렸어요. 우산을 꺼내고 문을 닫아 주세요.";
    render();
    setTimeout(function(){openSlot=null;render()},4000);
  },function(){busy=false;$("msg").textContent="문을 열지 못했어요. 잠시 후 다시 시도해 주세요."});
}

function fmt(ms){var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60;return h+":"+(m<10?"0":"")+m+":"+(c<10?"0":"")+c}
function tick(){
  var r=user&&st.rent[user.id];
  document.querySelectorAll(".timer").forEach(function(el){
    if(!r){el.hidden=true;return}
    el.hidden=false;
    var left=r.at+LIMIT-Date.now(),over=left<0;
    el.classList.toggle("over",over);
    el.querySelector(".tl").textContent=over?"반납 기한이 지났어요":"남은 대여시간";
    el.querySelector(".tv").textContent=(over?"+":"")+fmt(Math.abs(left));
    el.querySelector(".bar i").style.width=Math.max(0,Math.min(100,left/LIMIT*100))+"%";
    el.querySelector(".ts").textContent=r.slot+"번 칸에서 빌렸어요. 반납 기한은 "+new Date(r.at+LIMIT).toLocaleString("ko-KR",{month:"long",day:"numeric",hour:"numeric",minute:"2-digit"})+"이에요.";
  });
}
setInterval(tick,1000);

$("loginBtn").onclick=login;
$("joinBtn").onclick=signupInline;

$("pw").onkeydown=$("sid").onkeydown=function(e){if(e.key==="Enter")login()};
document.querySelectorAll(".logout").forEach(function(b){b.onclick=logout});
$("placeYes").onclick=function(){sel=null;openSlot=null;$("msg").textContent="";render();show("v-pick")};
$("placeNo").onclick=function(){$("placeErr").textContent="가까운 대여소의 QR 코드를 다시 스캔해 주세요."};
$("go").onclick=go;
$("tagBtn").onclick=function(){
  if(!waitTag)return;var slot=waitTag;
  st.slots[slot]="in";delete st.rent[user.id];save();
  waitTag=null;openSlot=null;$("tagBtn").hidden=true;tick();
  $("msg").textContent=slot+"번 반납이 완료됐어요. 문이 닫혔어요.";render();
};

// 장소 해시 변경 감지
window.addEventListener("hashchange",function(){var k=(location.hash||"#A1").slice(1).toUpperCase();if(STATIONS[k])sk=k});
</script>
</body>
</html>
